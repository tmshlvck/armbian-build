declare -g ARCH=arm64
declare -g OFFSET=16
declare -g ATFSOURCE='https://github.com/mtk-openwrt/arm-trusted-firmware.git'
# Build both SD/MMC and SPI NAND versions of BL2
# Format: "make_params;;output_files" - we'll build twice with different BOOT_DEVICE
# DDR4_4BG_MODE=1 enables 8GB DDR4 support (4 Bank Groups mode)
declare -g ATF_TARGET_MAP="PLAT=mt7988 BOOT_DEVICE=sdmmc USE_MKIMAGE=1 BOARD_BGA=1 HAVE_DRAM_OBJ_FILE=yes DRAM_USE_COMB=1 DDR4_4BG_MODE=1 all;;build/mt7988/release/bl2.img build/mt7988/release/bl31.bin"
declare -g ATFBRANCH="branch:mtksoc-20250212"
declare -g BOOTDELAY=1
declare -g BOOTPATCHDIR="${BOOTPATCHDIR:-"u-boot-filogic"}"
declare -g BOOTBRANCH="${BOOTBRANCH:-"tag:v2025.04"}"
declare -g BOOTENV_FILE='filogic.txt'
# Package both SD/MMC and SPI NAND bootloader files, plus eMMC-enabled FIP for NAND
declare -g UBOOT_TARGET_MAP=";;u-boot.bin u-boot_sdmmc.fip u-boot_nand_emmc.fip bl2.img bl2_spim-nand.img"
declare -g BOOTSCRIPT='boot-filogic.cmd:boot.cmd'
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g LINUXFAMILY=filogic

# This build requires xxd
function add_host_dependencies__filogic_add_xxd_hostdep() {
	display_alert "Adding xxd dep" "for ${BOARD} bootloader compile" "debug"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} xxd arm-trusted-firmware-tools"
}

# Build SPI NAND version of ATF after the standard SD/MMC version
function atf_custom_postprocess() {
	display_alert "Building SPI NAND version of ATF/BL2" "BOOT_DEVICE=spim-nand" "info"

	local atf_src_dir="$SRC/cache/sources/arm-trusted-firmware/mtksoc-20250212"
	local atf_build_dir="$atf_src_dir/build/mt7988/release"

	# Rename SD/MMC bl2.img before building SPI NAND version
	run_host_command_logged mv "$atf_build_dir/bl2.img" "$atf_build_dir/bl2_sdmmc.img"

	# Build BL2 for SPI NAND with UBI support (no clean needed, only bl2.img differs)
	run_host_command_logged make -C "$atf_src_dir" \
		PLAT=mt7988 \
		BOOT_DEVICE=spim-nand \
		USE_MKIMAGE=1 \
		BOARD_BGA=1 \
		HAVE_DRAM_OBJ_FILE=yes \
		DRAM_USE_COMB=1 \
		DDR4_4BG_MODE=1 \
		UBI=1 \
		bl2

	# Rename SPI NAND BL2 with distinct name
	run_host_command_logged mv "$atf_build_dir/bl2.img" "$atf_build_dir/bl2_spim-nand.img"

	# Restore SD/MMC BL2 as default bl2.img
	run_host_command_logged mv "$atf_build_dir/bl2_sdmmc.img" "$atf_build_dir/bl2.img"

	display_alert "SPI NAND ATF build" "completed" "info"
}

# Handling of FIP blobs
function uboot_custom_postprocess() {
	local uboot_dir="$SRC/cache/sources/u-boot-worktree/u-boot/v2025.04"
	local atf_dir="$SRC/cache/sources/arm-trusted-firmware/mtksoc-20250212/build/mt7988/release"

	# Copy BL2 variants to u-boot directory
	run_host_command_logged rm -f "$uboot_dir/bl2.img"
	run_host_command_logged cp "$atf_dir/bl2.img" "$uboot_dir"
	run_host_command_logged cp "$atf_dir/bl2_spim-nand.img" "$uboot_dir"

	# Create FIP #1: SD/MMC FIP (already built with SD device tree from main build)
	display_alert "Creating SD/MMC FIP" "with SD device tree" "info"
	run_host_command_logged rm -f "$uboot_dir/u-boot_sdmmc.fip"
	run_host_command_logged fiptool create \
	  --soc-fw "$atf_dir/bl31.bin" \
	  --nt-fw "$uboot_dir/u-boot.bin" \
	  "$uboot_dir/u-boot_sdmmc.fip"

	# Build U-Boot with eMMC device tree for SPI NAND installation
	display_alert "Building U-Boot with eMMC device tree" "for SPI NAND + eMMC" "info"

	# Save the current u-boot.bin (SD version)
	run_host_command_logged mv "$uboot_dir/u-boot.bin" "$uboot_dir/u-boot_sd.bin"

	# Setup cross-compilation variables (inherited from parent build)
	local cross_compile="CROSS_COMPILE=\"$CCACHE $UBOOT_COMPILER\""
	[[ -n $UBOOT_TOOLCHAIN2 ]] && cross_compile="ARMBIAN=foe" # empty parameter is not allowed

	# Reconfigure and rebuild with eMMC device tree
	run_host_command_logged "env" "-i" "${uboot_make_envs[@]}" \
		make -C "$uboot_dir" mt7988a_bananapi_bpi-r4-snand_defconfig
	run_host_command_logged "env" "-i" "${uboot_make_envs[@]}" \
		make -C "$uboot_dir" "$CTHREADS" "${cross_compile}"

	# Create FIP #2: NAND FIP with eMMC device tree
	display_alert "Creating NAND FIP" "with eMMC device tree" "info"
	run_host_command_logged fiptool create \
	  --soc-fw "$atf_dir/bl31.bin" \
	  --nt-fw "$uboot_dir/u-boot.bin" \
	  "$uboot_dir/u-boot_nand_emmc.fip"

	# Restore the SD version of u-boot.bin as default
	run_host_command_logged mv "$uboot_dir/u-boot_sd.bin" "$uboot_dir/u-boot.bin"
}

case $BRANCH in
	legacy)
		KERNELSOURCE='https://github.com/chainsx/linux-filogic.git'
		KERNELBRANCH="branch:linux-6.12.35"
		declare -g KERNEL_MAJOR_MINOR="6.12"
		KERNELPATCHDIR="${LINUXFAMILY}-${BRANCH}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

		;;

	current)
		KERNELSOURCE='https://github.com/frank-w/BPI-Router-Linux.git'
		KERNELBRANCH="branch:6.12-main"
		declare -g KERNEL_MAJOR_MINOR="6.12"
		KERNELPATCHDIR="archive/${LINUXFAMILY}-${KERNEL_MAJOR_MINOR}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

		;;

	edge)
		#KERNELSOURCE='https://github.com/frank-w/BPI-Router-Linux.git'
		#KERNELBRANCH="branch:6.16-rsslro"
		declare -g KERNEL_MAJOR_MINOR="6.16"
		KERNELPATCHDIR="archive/${LINUXFAMILY}-${KERNEL_MAJOR_MINOR}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

		;;
esac

write_uboot_platform() {
	dd if=$1/bl2.img of=$2 bs=512 seek=34 status=noxfer > /dev/null 2>&1
	dd if=$1/u-boot_sdmmc.fip of=$2 bs=512 seek=13312 status=noxfer >/dev/null 2>&1
	
	# backup gpt table
	LAST_START=$(parted "$2" unit s print | grep -v "^$" | tail -n 1 | awk '{print $2}' | tr -d 's')
	LAST_SIZE=$(parted "$2" unit s print | grep -v "^$" | tail -n 1 | awk '{print $4}' | tr -d 's')
	# write mtk gpt table
	dd if="${SRC}/packages/blobs/filogic/gpt" of="$2" conv=notrunc
	# append armbian rootfs info
	echo "${LAST_START},${LAST_SIZE}" | sfdisk --no-reread --append "$2"
}

write_uboot_platform_mtd() {
	# MediaTek MT7988 SPI NAND boot process:
	# MTD0 (bl2): BL2 bootloader (2MB) - can be written directly or via flashcp
	# MTD1 (ubi): UBI volume containing FIP (BL31 + U-Boot) (126MB)
	#
	# Parameters:
	#   $1 = u-boot files directory
	#   $2 = first MTD device path (e.g., /dev/mtdblock0) - for backward compatibility
	#   $3 = Log file name
	#   $4 = space-separated list of all MTD device names (e.g., "mtd0:bl2 mtd1:ubi")

	local DIR="$1"
	local LOGFILE="${3:-/dev/null}"

	echo "Installing bootloader to SPI NAND flash..." | tee -a "$LOGFILE"

	# Check if required files exist
	# Note: For SPI NAND boot, we need:
	#   1. BL2 specifically compiled for spim-nand (with UBI support)
	#   2. FIP with eMMC device tree (to access eMMC after booting from NAND)
	if [[ ! -f "$DIR/bl2_spim-nand.img" ]]; then
		echo "Error: SPI NAND BL2 image not found: $DIR/bl2_spim-nand.img" | tee -a "$LOGFILE"
		echo "Note: For SPI NAND boot, you need BL2 compiled with BOOT_DEVICE=spim-nand" | tee -a "$LOGFILE"
		echo "The regular bl2.img is for SD/MMC boot and will NOT work on SPI NAND" | tee -a "$LOGFILE"
		return 1
	fi

	if [[ ! -f "$DIR/u-boot_nand_emmc.fip" ]]; then
		echo "Error: NAND FIP image not found: $DIR/u-boot_nand_emmc.fip" | tee -a "$LOGFILE"
		echo "Note: For SPI NAND boot with eMMC support, you need the eMMC-enabled FIP" | tee -a "$LOGFILE"
		return 1
	fi

	local BL2_FILE="$DIR/bl2_spim-nand.img"
	local FIP_FILE="$DIR/u-boot_nand_emmc.fip"

	echo "Found SPI NAND BL2: $BL2_FILE" | tee -a "$LOGFILE"
	echo "Found NAND FIP with eMMC support: $FIP_FILE" | tee -a "$LOGFILE"

	# Step 1: Write BL2 to MTD0
	echo "Writing BL2 to /dev/mtd0 (bl2 partition)..." | tee -a "$LOGFILE"

	# Method 1: Try using flashcp (preferred for MTD devices)
	if command -v flashcp >/dev/null 2>&1; then
		flashcp -v "$BL2_FILE" /dev/mtd0 2>&1 | tee -a "$LOGFILE"
		if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
			echo "Error: flashcp failed" | tee -a "$LOGFILE"
			return 1
		fi
	else
		# Method 2: Fall back to direct MTD write (less safe)
		echo "Warning: flashcp not found, using direct MTD write" | tee -a "$LOGFILE"

		# Erase MTD0 first
		if command -v flash_erase >/dev/null 2>&1; then
			flash_erase /dev/mtd0 0 0 2>&1 | tee -a "$LOGFILE"
		fi

		# Write BL2
		dd if="$BL2_FILE" of=/dev/mtd0 bs=2048 2>&1 | tee -a "$LOGFILE"
		if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
			echo "Error: Writing BL2 failed" | tee -a "$LOGFILE"
			return 1
		fi
	fi

	echo "BL2 written successfully" | tee -a "$LOGFILE"

	# Step 2: Setup UBI on MTD1 and write FIP
	echo "Setting up UBI on /dev/mtd1 (ubi partition)..." | tee -a "$LOGFILE"

	# Check for required UBI tools
	if ! command -v ubiformat >/dev/null 2>&1; then
		echo "Error: UBI tools not found. Please install mtd-utils package" | tee -a "$LOGFILE"
		echo "Run: apt-get install mtd-utils" | tee -a "$LOGFILE"
		return 1
	fi

	# Detach any existing UBI device on MTD1
	if [[ -e /sys/class/ubi/ubi0 ]]; then
		local ubi_mtd
		ubi_mtd=$(cat /sys/class/ubi/ubi0/mtd_num 2>/dev/null)
		if [[ "$ubi_mtd" == "1" ]]; then
			echo "Detaching existing UBI device..." | tee -a "$LOGFILE"
			ubidetach -p /dev/mtd1 2>&1 | tee -a "$LOGFILE" || true
		fi
	fi

	# Format MTD1 for UBI
	echo "Formatting /dev/mtd1 for UBI..." | tee -a "$LOGFILE"
	ubiformat /dev/mtd1 -y 2>&1 | tee -a "$LOGFILE"
	if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
		echo "Error: ubiformat failed" | tee -a "$LOGFILE"
		return 1
	fi

	# Attach UBI device
	echo "Attaching UBI device..." | tee -a "$LOGFILE"
	ubiattach -p /dev/mtd1 2>&1 | tee -a "$LOGFILE"
	if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
		echo "Error: ubiattach failed" | tee -a "$LOGFILE"
		return 1
	fi

	# Wait for UBI device to appear
	sleep 1

	# Create FIP volume (4MiB static volume)
	echo "Creating FIP volume..." | tee -a "$LOGFILE"
	ubimkvol /dev/ubi0 -N fip -s 4MiB -t static 2>&1 | tee -a "$LOGFILE"
	if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
		echo "Error: ubimkvol failed" | tee -a "$LOGFILE"
		return 1
	fi

	# Wait for volume device to appear
	sleep 1

	# Update FIP volume with u-boot FIP
	echo "Writing FIP to UBI volume..." | tee -a "$LOGFILE"
	ubiupdatevol /dev/ubi0_0 "$FIP_FILE" 2>&1 | tee -a "$LOGFILE"
	if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
		echo "Error: ubiupdatevol failed" | tee -a "$LOGFILE"
		return 1
	fi

	echo "FIP written successfully" | tee -a "$LOGFILE"
	echo "" | tee -a "$LOGFILE"
	echo "Bootloader installation complete!" | tee -a "$LOGFILE"
	echo "BL2 installed to MTD0 (bl2)" | tee -a "$LOGFILE"
	echo "FIP installed to MTD1 (ubi/fip volume)" | tee -a "$LOGFILE"
	echo "" | tee -a "$LOGFILE"
	echo "You can now reboot and boot from SPI NAND" | tee -a "$LOGFILE"

	return 0
}
