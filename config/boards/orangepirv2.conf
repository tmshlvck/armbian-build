# OrangePi RV2 using BananaPi F3/SpacemiT kernel
# This target uses the community spacemit kernel with OrangePi RV2 device tree
# Intended for users with existing OrangePi bootloader in SPI flash
BOARD_NAME="Orange Pi RV2 (BPI kernel)"
BOARDFAMILY="spacemit"
BOARD_MAINTAINER="tmshlvck"
KERNEL_TARGET="current,edge"
BOOT_FDT_FILE="spacemit/k1-x_orangepi-rv2.dtb"
BOOTDELAY=1
SRC_EXTLINUX="yes"
SRC_CMDLINE="console=ttyS0,115200 earlycon=sbi clk_ignore_unused swiotlb=65536"
PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools"

function post_family_tweaks_bsp__orangepirv2_bpi_extras() {
	display_alert "$BOARD" "Installing OrangePi RV2 (BPI kernel) specific configuration" "info"

	# Install OrangePi RV2 RCPU firmware (from KY platform, NOT BananaPi F3)
	if [[ -d "$SRC/packages/blobs/riscv64/ky" ]]; then
		run_host_command_logged mkdir -pv "${destination}"/lib/firmware
		display_alert "$BOARD" "Installing RCPU firmware" "info"
		run_host_command_logged cp -fv $SRC/packages/blobs/riscv64/ky/esos.elf "${destination}"/lib/firmware
	fi

	# Force load wireless module - OrangePi RV2 uses 8852bs like BananaPi F3
	display_alert "$BOARD" "Force load wireless" "info"
	run_host_command_logged mkdir -pv "${destination}"/etc/modules-load.d
	run_host_command_logged echo "8852bs" > "${destination}"/etc/modules-load.d/${BOARD}.conf

	# Workaround for edge kernel boot hang caused by systemd-tmpfiles
	# See: https://github.com/armbian/build/issues/XXXX
	if [[ "${BRANCH}" == "edge" ]]; then
		display_alert "$BOARD" "Masking systemd-tmpfiles services for edge kernel workaround" "info"
		run_host_command_logged mkdir -pv "${destination}"/etc/systemd/system
		run_host_command_logged ln -sfv /dev/null "${destination}"/etc/systemd/system/systemd-tmpfiles-clean.service
		run_host_command_logged ln -sfv /dev/null "${destination}"/etc/systemd/system/systemd-tmpfiles-setup-dev-early.service
		run_host_command_logged ln -sfv /dev/null "${destination}"/etc/systemd/system/systemd-tmpfiles-setup-dev.service
		run_host_command_logged ln -sfv /dev/null "${destination}"/etc/systemd/system/systemd-tmpfiles-setup.service
	fi
}
